spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/museum}
    username: museum
    password: museum
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
logging:
  level:
    root: warn
