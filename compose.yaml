services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: museum
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - museum_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/museum
    depends_on:
      db:
        condition: service_healthy
  tests:
    profiles: ["test"]
    build:
      context: .
      target: build
    command: ["mvn", "-B", "-ntp", "test"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/museum
    depends_on:
      db:
        condition: service_healthy

volumes:
  museum_data:
